<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- 🔹 Navigation Bar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">Gradlink</h1>
      <ul class="flex space-x-6">
        <li><a href="#" class="hover:text-blue-600">Directory</a></li>
        <li><a href="#" class="hover:text-blue-600">Events</a></li>
        <li><a href="#" class="hover:text-blue-600">Job Board</a></li>
        <li><a href="#" class="hover:text-blue-600">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- 🔹 Hero Banner -->
  <section class="bg-blue-600 text-white py-16">
    <div class="max-w-3xl mx-auto text-center">
      <h2 class="text-3xl font-bold mb-6">Find Your Alumni Network</h2>
      <input id="searchInput" type="text" placeholder="Search by name, company, or batch..."
        class="w-full px-4 py-3 rounded-md text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
  </section>

  <!-- 🔹 Alumni Directory -->
  <section class="max-w-6xl mx-auto px-6 py-12">
    <h3 class="text-2xl font-semibold mb-6">Alumni Directory</h3>
    <div id="alumniGrid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <!-- Sample Profile Card -->
      <div class="bg-white shadow-md rounded-lg p-4 text-center alumni-card" data-name="Alice Johnson" data-company="Google" data-batch="2015">
        <img src="https://i.pravatar.cc/150?img=1" alt="Avatar" class="w-24 h-24 mx-auto rounded-full mb-4">
        <h4 class="font-bold">Alice Johnson</h4>
        <p class="text-sm text-gray-600">Software Engineer, Google (2015)</p>
        <button onclick="connect('Alice Johnson')" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Connect</button>
      </div>

      <div class="bg-white shadow-md rounded-lg p-4 text-center alumni-card" data-name="Rahul Mehta" data-company="Microsoft" data-batch="2018">
        <img src="https://i.pravatar.cc/150?img=2" alt="Avatar" class="w-24 h-24 mx-auto rounded-full mb-4">
        <h4 class="font-bold">Rahul Mehta</h4>
        <p class="text-sm text-gray-600">Product Manager, Microsoft (2018)</p>
        <button onclick="connect('Rahul Mehta')" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Connect</button>
      </div>

      <div class="bg-white shadow-md rounded-lg p-4 text-center alumni-card" data-name="Sophia Lee" data-company="Amazon" data-batch="2020">
        <img src="https://i.pravatar.cc/150?img=3" alt="Avatar" class="w-24 h-24 mx-auto rounded-full mb-4">
        <h4 class="font-bold">Sophia Lee</h4>
        <p class="text-sm text-gray-600">UX Designer, Amazon (2020)</p>
        <button onclick="connect('Sophia Lee')" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Connect</button>
      </div>

    </div>
  </section>

  <!-- 🔹 JavaScript -->
  <script>
    // Search filter
    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase();
      document.querySelectorAll('.alumni-card').forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const company = card.dataset.company.toLowerCase();
        const batch = card.dataset.batch.toLowerCase();
        card.style.display = (name.includes(query) || company.includes(query) || batch.includes(query)) ? 'block' : 'none';
      });
    });

    // Connect button interaction
    function connect(name) {
      alert(`Connection request sent to ${name}!`);
    }
  </script>

</body>
</html>
